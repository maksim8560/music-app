<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Music App</title>

<style>
body {
    margin: 0;
    font-family: -apple-system;
    background: #000;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* UI */
.player {
    width: 320px;
    padding: 20px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    border-radius: 25px;
}

button {
    padding: 10px;
    margin: 5px;
}
</style>
</head>

<body>

<div class="player">
    <h3 id="title">Loading...</h3>

    <button onclick="login()">Login Admin</button>
    <button onclick="add()">Add Station</button>

    <div id="list"></div>

    <p id="footer"></p>
</div>

<script>
let token = "";
let stations = [];

async function loadStations() {
    const res = await fetch("http://localhost:3000/stations");
    stations = await res.json();

    const list = document.getElementById("list");
    list.innerHTML = "";

    stations.forEach(s => {
        const div = document.createElement("div");
        div.innerHTML = s.name;
        list.appendChild(div);
    });
}

async function login() {
    const res = await fetch("http://localhost:3000/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            user: "Admin",
            pass: "952378"
        })
    });

    const data = await res.json();
    token = data.token;

    alert("Logged in!");
}

async function add() {
    const name = prompt("Name");
    const stream = prompt("Stream URL");

    await fetch("http://localhost:3000/stations", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": token
        },
        body: JSON.stringify({ name, stream })
    });

    loadStations();
}

loadStations();
</script>

</body>
</html>
