# Publishes the Sonora player (./sonora) as a static site.
#
# No Jekyll on purpose: the project is plain HTML + ES modules + CSS with no
# front matter, and a static copy is the only way to be sure the files reach
# the browser exactly as written. `.nojekyll` in the folder stops GitHub Pages
# from applying its own processing as well.
#
# The repository root holds a separate Node application; this workflow touches
# only ./sonora and leaves it alone.

name: Deploy Sonora to GitHub Pages

on:
  push:
    branches: ["Main", "main"]
    paths:
      - "sonora/**"
      - ".github/workflows/pages-sonora.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never interrupt one that is already running.
concurrency:
  group: "pages-sonora"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload the player as-is
        uses: actions/upload-pages-artifact@v3
        with:
          path: sonora

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
